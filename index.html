<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#081118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resus">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>Resus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Okuma uygulaması — monitör görünümü. Koyu cam zemin; sayılar ve dozlar monitör yeşili, bilgi camgöbeği,
   alarm kırmızısı, uyarı sarısı. Düz metin sakin; renk yalnız anlam taşır. Tek sütun, bölüm tek seferde açılır. */
:root {
  --zemin: #FFFFFF; --yuzey: #F2F6F8; --yuzey2: #E8EEF2; --cizgi: #D9E2E8;
  --metin: #10202B; --soluk: #566A79;
  --ekg: #08814A; --ekg-yuzey: #EAF6EF; --ekg-cizgi: #A9D9BE;
  --bilgi: #086A92; --bilgi-dolgu: #0A7AA8; --bilgi-yuzey: #EAF4F9; --bilgi-cizgi: #B5D7E7;
  --alarm: #C42136; --alarm-dolgu: #C42136; --alarm-yuzey: #FCEEF0; --alarm-cizgi: #EDB3BC;
  --uyari: #8A5A00; --uyari-dolgu: #E3A21A; --uyari-yuzey: #FDF5E3; --uyari-cizgi: #EBCB85;
  --gorsel-zemin: #FFFFFF;
  --birincil: #0A7AA8; --birincil-metin: #FFFFFF;
  --golge: 0 10px 28px rgba(16, 32, 43, .16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #081118; --yuzey: #0E1A23; --yuzey2: #13232E; --cizgi: #1E3241;
    --metin: #D4DEE5; --soluk: #8296A4;
    --ekg: #4BE08A; --ekg-yuzey: rgba(75, 224, 138, .08); --ekg-cizgi: rgba(75, 224, 138, .34);
    --bilgi: #4CC9F0; --bilgi-dolgu: #4CC9F0; --bilgi-yuzey: rgba(76, 201, 240, .07); --bilgi-cizgi: rgba(76, 201, 240, .32);
    --alarm: #FF5D6C; --alarm-dolgu: #E2394B; --alarm-yuzey: rgba(255, 93, 108, .08); --alarm-cizgi: rgba(255, 93, 108, .36);
    --uyari: #FFC53D; --uyari-dolgu: #FFC53D; --uyari-yuzey: rgba(255, 197, 61, .07); --uyari-cizgi: rgba(255, 197, 61, .34);
    --gorsel-zemin: #E9EEF1;
    --birincil: #4CC9F0; --birincil-metin: #04131B;
    --golge: 0 10px 28px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #081118; --yuzey: #0E1A23; --yuzey2: #13232E; --cizgi: #1E3241;
  --metin: #D4DEE5; --soluk: #8296A4;
  --ekg: #4BE08A; --ekg-yuzey: rgba(75, 224, 138, .08); --ekg-cizgi: rgba(75, 224, 138, .34);
  --bilgi: #4CC9F0; --bilgi-dolgu: #4CC9F0; --bilgi-yuzey: rgba(76, 201, 240, .07); --bilgi-cizgi: rgba(76, 201, 240, .32);
  --alarm: #FF5D6C; --alarm-dolgu: #E2394B; --alarm-yuzey: rgba(255, 93, 108, .08); --alarm-cizgi: rgba(255, 93, 108, .36);
  --uyari: #FFC53D; --uyari-dolgu: #FFC53D; --uyari-yuzey: rgba(255, 197, 61, .07); --uyari-cizgi: rgba(255, 197, 61, .34);
  --gorsel-zemin: #E9EEF1;
  --birincil: #4CC9F0; --birincil-metin: #04131B;
  --golge: 0 10px 28px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; background: var(--zemin); color: var(--metin); }
body { font: 17px/1.55 -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--bilgi); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.soluk { color: var(--soluk); }
.kucuk { font-size: 14px; }

/* ---------- iskelet */
.ekran { max-width: 680px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) 16px calc(env(safe-area-inset-bottom, 0px) + 96px); }
.ekran > h1 { font-size: 28px; line-height: 1.15; margin: 22px 0 6px; letter-spacing: -.01em; }
.ekran > h2 { font-size: 14px; color: var(--bilgi); margin: 26px 0 10px; font-weight: 700; }
.giris { color: var(--soluk); margin: 0 0 18px; }

/* ---------- sekme çubuğu */
.sekmeler { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--zemin); border-top: 1px solid var(--cizgi);
  padding: 4px 4px calc(env(safe-area-inset-bottom, 0px) + 4px); display: grid; grid-template-columns: repeat(5, 1fr); }
.sekme { appearance: none; border: 0; background: none; color: var(--soluk); min-height: 54px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; border-radius: 10px; }
.sekme svg { width: 24px; height: 24px; }
.sekme.on { color: var(--bilgi); }

/* ---------- bölüm başlığı: monitör üst şeridi + EKG izi */
.bant { margin: 0 -16px; padding: 18px 16px 0; }
.bant .ust { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.bant .no { color: var(--bilgi); font-weight: 800; letter-spacing: .04em; }
.bant .etiket { color: var(--soluk); font-weight: 600; text-align: right; }
.bant .ad { font-size: 32px; font-weight: 800; letter-spacing: -.01em; margin: 8px 0 0; line-height: 1.05; color: var(--metin); }
.bant .en { color: var(--soluk); font-size: 15px; margin-top: 4px; }
.bant .slogan { color: var(--uyari); font-size: 14.5px; margin-top: 10px; font-weight: 600; }
.iz { display: block; width: 100%; height: 40px; margin-top: 10px; color: var(--ekg); overflow: visible; }
.iz path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.iz .ciz { stroke-dasharray: 1; stroke-dashoffset: 1; animation: iz 1.8s cubic-bezier(.3, .1, .3, 1) .15s forwards; }
@keyframes iz { to { stroke-dashoffset: 0; } }
.ilerleme { margin: 0 -16px; height: 3px; background: var(--cizgi); }
.ilerleme > i { display: block; height: 100%; width: 0; background: var(--ekg); transition: width .3s ease; }

/* ---------- yapışkan kısım çubuğu */
.kisim-sec { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 8px; margin: 0 -16px; padding: 8px 16px;
  background: var(--zemin); border-bottom: 1px solid var(--cizgi); }
.bolum-btn, .hizli-btn { flex: none; appearance: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--metin); display: grid; place-items: center; }
.bolum-btn svg, .hizli-btn svg { width: 22px; height: 22px; }
.hizli-btn[aria-pressed="true"] { background: var(--uyari-dolgu); border-color: var(--uyari-dolgu); color: #1A1200; }
.cipler { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.cipler::-webkit-scrollbar { display: none; }
.cipler button { flex: none; appearance: none; min-height: 40px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--cizgi);
  background: transparent; color: var(--soluk); font-size: 14px; font-weight: 600; }
.cipler button.simdi { border-color: var(--bilgi); color: var(--bilgi); background: var(--bilgi-yuzey); }

/* hızlı tekrar şeridi */
.hizli-bant { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 10px 6px 10px 14px; border-radius: 12px;
  border: 1px solid var(--uyari-cizgi); background: var(--uyari-yuzey); font-size: 15px; }
.hizli-bant b { color: var(--uyari); }
.hizli-bant span { flex: 1; min-width: 0; }
.hizli-bant .btn { min-height: 44px; padding: 6px 14px; font-size: 15px; }
.okuyucu.hizli .h-gizle { display: none !important; }
.okuyucu.hizli .kisim.h-bos { display: none; }

/* ---------- kısım başlığı: kitaptaki büyük harf, solunda kanal çizgisi */
.kisim { scroll-margin-top: 64px; }
.okuyucu [id^="o-"] { scroll-margin-top: 74px; }
.kb { margin: 36px 0 14px; padding-left: 12px; border-left: 3px solid currentColor; color: var(--bilgi); font-weight: 800; font-size: 14px; letter-spacing: .03em; line-height: 1.35; }
.kb.bordo { color: var(--alarm); }
.kb.amber { color: var(--uyari); }
.kb.yesil { color: var(--ekg); }
.kisim-dikkat { margin-top: 24px; }

/* ---------- okuma öğeleri: araçlar sağ üstte yüzer, metin akar */
.oge { position: relative; }
.satir::after { content: ""; display: block; clear: both; }
.satir .yazi { overflow-wrap: break-word; }
.araclar { float: right; display: flex; align-items: center; gap: 2px; margin: -9px -8px -4px 6px; }
.arac { appearance: none; border: 0; background: none; color: var(--soluk); min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 10px; font-size: 13.5px; font-weight: 700; }
.arac:active { background: rgba(127,127,127,.16); }
.arac svg { width: 22px; height: 22px; }
.arac.yildiz.on { color: var(--uyari); }
.arac.neden-btn { padding: 0 8px; color: var(--bilgi); }
.neden { margin-top: 8px; background: var(--bilgi-yuzey); border-left: 3px solid var(--bilgi); border-radius: 8px; padding: 10px 14px; font-size: 15.5px; color: var(--metin); font-weight: 400; text-align: left; }
.neden p { margin: 0; }
.neden p + p { margin-top: 8px; }
.neden b { color: var(--bilgi); }
.yanip { animation: yanip 1.6s ease-out; border-radius: 10px; }
@keyframes yanip { 0% { box-shadow: 0 0 0 3px var(--ekg); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* sayılar monitörde okunur gibi: yeşil, eşit genişlikte rakam */
.deger { font-weight: 750; color: var(--ekg); }
.okuyucu.bulanik .deger:not(.goster) { filter: blur(6px); cursor: pointer; user-select: none; -webkit-user-select: none; }
.bag { text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: pointer; border-radius: 3px; }
.bag:active { background: rgba(127,127,127,.18); }

/* kutular: monitör kanalları */
.kutular { display: grid; gap: 8px; }
.oge.kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-left: 3px solid var(--bilgi); border-radius: 10px; padding: 12px 8px 12px 14px; font-weight: 650; font-size: 17.5px; }
.oge.kutu .deger { font-size: 1.12em; }

/* uyarı */
.dikkat { border: 1px solid var(--uyari-cizgi); border-radius: 12px; overflow: hidden; background: var(--uyari-yuzey); }
.dikkat .etk { display: inline-flex; align-items: center; gap: 7px; background: var(--uyari-dolgu); color: #1A1200; font-weight: 800; font-size: 12.5px;
  letter-spacing: .05em; padding: 5px 12px 5px 8px; border-bottom-right-radius: 10px; }
.dikkat .etk b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #1A1200; color: var(--uyari-dolgu); font-size: 13px; line-height: 1; }
.dikkat .govde { padding: 12px 6px 12px 14px; }
.dikkat .oge + .oge { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--uyari-cizgi); }

/* dallanan şema: alarm */
.fan-merkez { border: 1.5px solid var(--alarm); background: var(--alarm-yuzey); color: var(--alarm); border-radius: 12px; padding: 12px 16px; text-align: center; font-weight: 800; font-size: 19px; letter-spacing: .02em; }
.fan-merkez small { display: block; font-weight: 500; font-size: 13.5px; color: var(--soluk); letter-spacing: 0; margin-top: 2px; }
.dallar { position: relative; margin: 0 0 0 14px; padding: 12px 0 0 16px; border-left: 2px solid var(--alarm-cizgi); }
.olduren { position: relative; background: var(--yuzey); border: 1px solid var(--cizgi); border-left: 3px solid var(--alarm); border-radius: 10px; padding: 10px 8px 12px 14px; }
.olduren + .olduren { margin-top: 12px; }
.olduren::before { content: ""; position: absolute; left: -19px; top: 22px; width: 15px; height: 2px; background: var(--alarm-cizgi); }
.olduren h3.ad { margin: 0 0 6px; color: var(--alarm); font-weight: 800; font-size: 17px; letter-spacing: .01em; }
.lbl { font-size: 12px; font-weight: 800; letter-spacing: .05em; color: var(--soluk); margin-bottom: 2px; }
.olduren .hamle .yazi { color: var(--bilgi); font-weight: 700; }
.olduren .hamle .yazi:not(.parcali)::before, .olduren .hamle .parca::before { content: "▸ "; }
.olduren .hamle .parca + .parca { margin-top: 4px; }
.olduren .oge.hamle { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--cizgi); }

/* madde listeleri: kutu yok, alarm noktası ve ince ayraç */
.liste-kutu { padding: 0; }
.oge.madde { padding-left: 20px; }
.oge.madde::before { content: ""; position: absolute; left: 2px; top: .62em; width: 9px; height: 9px; border-radius: 50%; background: var(--alarm); box-shadow: 0 0 8px var(--alarm-cizgi); }
.liste-kutu.amber .oge.madde::before { background: var(--uyari-dolgu); box-shadow: 0 0 8px var(--uyari-cizgi); }
.oge.madde + .oge.madde { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--cizgi); }
.oge.madde + .oge.madde::before { top: calc(12px + .62em); }

/* tablo (skor) */
.tablo-kap { overflow-x: auto; border: 1px solid var(--cizgi); border-radius: 12px; -webkit-overflow-scrolling: touch; }
.tablo { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.4; }
.tablo th, .tablo td { padding: 8px 7px; text-align: left; vertical-align: top; border-top: 1px solid var(--cizgi); }
.tablo th:first-child, .tablo td:first-child { padding-left: 10px; }
.tablo thead th { background: var(--yuzey2); color: var(--bilgi); font-size: 12px; letter-spacing: .04em; border-top: 0; white-space: nowrap; }
.tablo tbody th { color: var(--metin); font-weight: 700; }
.tablo tbody tr:nth-child(even) { background: var(--yuzey); }
.oge.tablo-not { margin-top: 10px; font-size: 15px; font-weight: 600; }

/* trafik ışığı: yanan lamba */
.isik { border: 1px solid var(--cizgi); border-left: 3px solid var(--cizgi); border-radius: 10px; padding: 10px 8px 12px 14px; background: var(--yuzey); }
.isik + .isik { margin-top: 10px; }
.isik-bas { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; margin-bottom: 4px; }
.isik .nokta { width: 13px; height: 13px; border-radius: 50%; flex: none; }
.isik.kirmizi { border-left-color: var(--alarm); } .isik.kirmizi .isik-bas { color: var(--alarm); } .isik.kirmizi .nokta { background: var(--alarm); box-shadow: 0 0 10px var(--alarm); }
.isik.amber { border-left-color: var(--uyari-dolgu); } .isik.amber .isik-bas { color: var(--uyari); } .isik.amber .nokta { background: var(--uyari-dolgu); box-shadow: 0 0 10px var(--uyari-dolgu); }
.isik.yesil { border-left-color: var(--ekg); } .isik.yesil .isik-bas { color: var(--ekg); } .isik.yesil .nokta { background: var(--ekg); box-shadow: 0 0 10px var(--ekg); }

/* başlıklı kartlar */
.kartlar { display: grid; gap: 8px; }
.oge.kart { border: 1px solid var(--cizgi); border-radius: 10px; padding: 10px 8px 12px 14px; background: var(--yuzey); }
.kartlar.pembe .oge.kart { border-left: 3px solid var(--alarm); }
.kartlar.mavi .oge.kart { border-left: 3px solid var(--bilgi); }
.kart-bas { font-weight: 800; font-size: 16.5px; margin-bottom: 2px; }
.kartlar.pembe .kart-bas { color: var(--alarm); }
.kartlar.mavi .kart-bas { color: var(--bilgi); }
.oge.kart .yazi { font-size: 15.5px; }

/* alanlı tanı kartları */
.ayiricilar { display: grid; gap: 10px; }
.ayirici { border: 1px solid var(--cizgi); border-left: 3px solid var(--bilgi); border-radius: 10px; overflow: hidden; background: var(--yuzey); }
.ayirici.r-olduren { border-left-color: var(--alarm); }
.ayirici.r-ciddi { border-left-color: var(--uyari-dolgu); }
.ayirici.r-ayaktan { border-left-color: var(--ekg); }
.ayirici header { display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 12px; background: var(--yuzey2); }
.ayirici header h3 { flex: 1; min-width: 0; margin: 0; font-size: 17px; line-height: 1.25; color: var(--metin); }
.ayirici header .araclar, .ilac header .araclar { float: none; margin: -6px -2px -6px 0; }
.rozet { flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: var(--bilgi); border: 1px solid var(--bilgi-cizgi); padding: 2px 7px; border-radius: 6px; }
.ayirici.r-olduren .rozet { color: var(--alarm); border-color: var(--alarm-cizgi); }
.ayirici.r-ciddi .rozet { color: var(--uyari); border-color: var(--uyari-cizgi); }
.ayirici.r-ayaktan .rozet { color: var(--ekg); border-color: var(--ekg-cizgi); }
.ayirici.r-kirmizi { border-left-color: var(--alarm); }
.ayirici.r-amber { border-left-color: var(--uyari-dolgu); }
.ayirici.r-kirmizi .rozet { color: var(--alarm); border-color: var(--alarm-cizgi); }
.ayirici.r-amber .rozet { color: var(--uyari); border-color: var(--uyari-cizgi); }
.ayirici dl { display: grid; grid-template-columns: 86px 1fr; gap: 7px 10px; margin: 0; padding: 10px 12px 12px; font-size: 15px; line-height: 1.45; }
.ayirici dt { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--soluk); padding-top: 3px; }
.ayirici dt.tedavi { color: var(--alarm); }
.ayirici dd { margin: 0; min-width: 0; overflow-wrap: break-word; }
.ayirici dd.koyu { font-weight: 650; }
.ayirici dd.soluk { color: var(--soluk); }
.ayirici > .neden { margin: 0 12px 12px; }

/* ayırt et */
.matris { display: grid; gap: 8px; }
.matris-kart { border: 1px solid var(--cizgi); border-radius: 10px; padding: 10px 12px 12px; background: var(--yuzey); }
.matris-kart h3 { margin: 0 0 6px; font-size: 16.5px; color: var(--metin); }
.matris-kart dl { display: grid; grid-template-columns: 108px 1fr; gap: 5px 10px; margin: 0; font-size: 15px; line-height: 1.4; }
.matris-kart dt { font-size: 10.5px; font-weight: 800; letter-spacing: .03em; color: var(--soluk); padding-top: 3px; }
.matris-kart dd { margin: 0; min-width: 0; overflow-wrap: break-word; }

/* bulguya göre süzme */
.suz { margin: 0 0 12px; }
.suz-ac { appearance: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 12px;
  border: 1px solid var(--ekg-cizgi); background: var(--ekg-yuzey); color: var(--ekg); font-weight: 700; font-size: 15px; }
.suz-ac svg { width: 18px; height: 18px; }
.suz-cipler { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.suz-cip { appearance: none; min-height: 40px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--cizgi); background: transparent; color: var(--metin); font-size: 14.5px; font-weight: 600; }
.suz-cip[aria-pressed="true"] { border-color: var(--ekg); background: var(--ekg-yuzey); color: var(--ekg); }
.suz-sonuc { margin-top: 10px; font-size: 15px; color: var(--soluk); }
.suz-sonuc b { color: var(--ekg); }
.suz-sonuc .btn { min-height: 40px; padding: 4px 12px; font-size: 14px; margin-left: 6px; vertical-align: middle; }
.okuyucu.suzuluyor .suz-hedef { transition: opacity .2s ease; }
.okuyucu.suzuluyor .suz-hedef:not(.suz-tamam) { opacity: .3; }
.okuyucu.suzuluyor .suz-hedef.suz-tamam { box-shadow: 0 0 0 2px var(--ekg); border-radius: 10px; }

/* mekanizma akışı */
.akis { display: flex; flex-direction: column; }
.akis-kutu { border: 1px solid var(--bilgi-cizgi); border-radius: 10px; padding: 8px 12px; text-align: center; background: var(--bilgi-yuzey); }
.akis-kutu b { display: block; color: var(--bilgi); font-size: 15.5px; letter-spacing: .02em; }
.akis-kutu span { display: block; color: var(--soluk); font-size: 14px; }
.akis-kutu.kirmizi { border-color: var(--alarm-cizgi); background: var(--alarm-yuzey); }
.akis-kutu.kirmizi b { color: var(--alarm); }
.akis .ok { text-align: center; color: var(--ekg); font-weight: 800; line-height: 1; padding: 4px 0; }
.akis .ok::before { content: "↓"; }
.oge.akis-not { margin-top: 12px; color: var(--alarm); font-weight: 700; font-size: 15.5px; }

/* görsel + işaret noktaları */
.gorsel { margin: 0 0 8px; background: var(--gorsel-zemin); border-radius: 12px; padding: 8px; }
.gorsel-kap { position: relative; }
.gorsel img { display: block; width: 100%; height: auto; }
.isaret { position: absolute; transform: translate(-50%, -50%); appearance: none; width: 28px; height: 28px; padding: 0; border-radius: 50%;
  border: 2px solid #0B6B3A; background: rgba(255, 255, 255, .92); color: #0B6B3A; font-weight: 800; font-size: 14px; line-height: 1; display: grid; place-items: center;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.isaret::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
.isaret[aria-pressed="true"] { background: #0B6B3A; color: #FFFFFF; }
.isaret-cubuk { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
.isaret-bilgi { flex: 1; min-width: 180px; font-size: 15.5px; color: var(--soluk); }
.isaret-bilgi b { color: var(--metin); font-size: 17px; }
.isaret-cubuk .btn { min-height: 44px; padding: 6px 14px; font-size: 14.5px; }
.vurgu { background: var(--ekg-yuzey); box-shadow: 0 0 0 2px var(--ekg-cizgi); border-radius: 8px; }
.paragraf .oge + .oge { margin-top: 8px; }

/* ilaç şeridi */
.ilaclar { display: grid; gap: 8px; }
.ilac { border: 1px solid var(--cizgi); border-left: 3px solid var(--bilgi); border-radius: 10px; padding: 8px 8px 10px 12px; background: var(--yuzey); }
.ilac header { display: flex; align-items: center; gap: 8px; }
.ilac h3 { flex: 1; min-width: 0; margin: 0; font-size: 17px; color: var(--bilgi); }
.ilac .doz { margin-top: 2px; font-size: 15.5px; }
.ilac .verme { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--cizgi); font-size: 15px; color: var(--alarm); }
.ilac .verme b { font-weight: 800; }
.ilac .neden { margin-top: 8px; }

/* soru-cevap */
.vaka { border: 1px solid var(--bilgi-cizgi); border-radius: 12px; padding: 12px 14px; background: var(--bilgi-yuzey); }
.vaka > .etk, .cevap > .etk { font-size: 12.5px; font-weight: 800; letter-spacing: .05em; color: var(--bilgi); }
.cevap > .etk.yesil { color: var(--ekg); }
.vaka > p { margin: 4px 0 12px; }
.cevap { margin-top: 10px; }
.oge.cevap-oge + .oge.cevap-oge { margin-top: 6px; }
.oge.cevap-oge .no { font-weight: 800; color: var(--ekg); margin-right: 4px; }
.oge.cevap-oge .yazi { display: inline; }
.btn.ince { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.sorular { margin: 0; border: 1px solid var(--ekg-cizgi); border-radius: 12px; background: var(--ekg-yuzey); padding: 12px 12px 12px 34px; }
.sorular li + li { margin-top: 14px; }
.sorular li::marker { color: var(--ekg); font-weight: 800; }
.soru { margin: 0 0 8px; font-weight: 700; color: var(--metin); }

/* bölüm sonu */
.son { margin: 36px 0 0; padding: 16px; border-radius: 12px; background: var(--yuzey); color: var(--soluk); font-size: 15.5px; }
.son-ust { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--metin); }
.son-ust svg { width: 20px; height: 20px; color: var(--ekg); flex: none; }
.son p { margin: 6px 0 12px; }
.son .btn svg { width: 18px; height: 18px; }

/* düğmeler, listeler */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px; border-radius: 12px;
  border: 1px solid var(--cizgi); background: var(--yuzey2); color: var(--metin); font-weight: 700; }
.btn.birincil { background: var(--birincil); border-color: var(--birincil); color: var(--birincil-metin); }
.btn.tehlike { color: var(--alarm); border-color: var(--alarm-cizgi); background: var(--alarm-yuzey); }
.btn.blok { width: 100%; }
.btn:disabled { opacity: .5; }
.liste { border: 1px solid var(--cizgi); border-radius: 14px; overflow: hidden; background: var(--yuzey); }
.liste > * + * { border-top: 1px solid var(--cizgi); }
.sat { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 12px 16px; width: 100%; border: 0; background: none; text-align: left; }
button.sat:active { background: var(--yuzey2); }
.sat .g { flex: 1; min-width: 0; }
.sat .a { color: var(--soluk); font-size: 14px; margin-top: 2px; }
.sat .s { color: var(--soluk); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.sat .s svg { width: 16px; height: 16px; color: var(--ekg); }
.sat.kapali { opacity: .5; }
.sat .cubuk { margin-top: 8px; }
.secim { display: flex; flex-wrap: wrap; gap: 8px; }
.secim button { appearance: none; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--cizgi); background: transparent; font-weight: 600; }
.secim button.on { border-color: var(--bilgi); color: var(--bilgi); background: var(--bilgi-yuzey); }
.ayar { padding: 14px 16px; }
.ayar .e { font-weight: 700; margin-bottom: 10px; }
.ayar .a { color: var(--soluk); font-size: 14px; margin-top: 8px; }
.cubuk { height: 4px; border-radius: 2px; background: var(--cizgi); overflow: hidden; }
.cubuk > i { display: block; height: 100%; background: var(--ekg); }
.hakkinda { padding: 16px; }
.hakkinda .kitap { font-weight: 800; color: var(--bilgi); }
.hakkinda .yazar { font-size: 18px; font-weight: 700; margin-top: 4px; }
.bos { text-align: center; color: var(--soluk); padding: 36px 12px; }
.bos b { display: block; color: var(--metin); font-size: 18px; margin-bottom: 6px; }

/* alt sayfa (sheet) */
.sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(2, 8, 12, .62); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 680px; max-height: 86vh; max-height: 86dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--yuzey);
  border-radius: 20px 20px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); box-shadow: var(--golge); border-top: 1px solid var(--cizgi); }
.sheet .tutamak { width: 40px; height: 5px; border-radius: 3px; background: var(--cizgi); margin: 0 auto 12px; }
.sheet h3 { font-size: 20px; margin: 2px 0 12px; }
.sheet h4 { font-size: 15px; margin: 16px 0 4px; color: var(--bilgi); }
.sheet p { margin: 10px 0 0; }
.sheet .tablo-kap { margin-bottom: 8px; }
.sheet .tablo tbody tr:nth-child(even) { background: var(--yuzey2); }
.sheet-alt { display: grid; gap: 10px; margin-top: 18px; }
.alan { margin-top: 10px; }
.alan .e { font-size: 12px; font-weight: 800; letter-spacing: .05em; color: var(--soluk); text-transform: uppercase; }
.alan .m { margin-top: 2px; }
.tr { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--yuzey2); font-size: 15px; }
.tr b { font-size: 16px; }
.kisa { color: var(--soluk); font-size: 15px; }
.kisa.buyuk { font-size: 17px; color: var(--metin); }
.ara { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--cizgi); font-size: 13px; font-weight: 700; color: var(--bilgi); }

/* kilit */
.kilit { max-width: 420px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px 20px; }
.kilit .logo { width: 68px; height: 68px; border-radius: 16px; margin-bottom: 18px; }
.kilit h1 { font-size: 30px; margin: 0 0 8px; }
.kilit p { color: var(--soluk); margin: 0 0 22px; }
.kilit input { width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--cizgi); background: var(--yuzey); font-size: 18px; margin-bottom: 12px; }
.kilit input:focus { border-color: var(--bilgi); outline: none; }
.kilit .hata { color: var(--alarm); min-height: 24px; margin: 2px 0 10px; font-weight: 600; }
.kilit .bekle { color: var(--bilgi); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 80; pointer-events: none;
  background: var(--metin); color: var(--zemin); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; max-width: 90vw; box-shadow: var(--golge); }
textarea.alanyazi { width: 100%; min-height: 120px; padding: 12px; border-radius: 12px; border: 1px solid var(--cizgi); background: var(--zemin); font-size: 15px; }

/* geniş ekranda iki sütun */
@media (min-width: 600px) {
  .kartlar, .ilaclar { grid-template-columns: 1fr 1fr; }
  .akis { flex-direction: row; align-items: stretch; }
  .akis-kutu { flex: 1; }
  .akis .ok { align-self: center; padding: 0 4px; }
  .akis .ok::before { content: "→"; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .iz .ciz { stroke-dashoffset: 0; } }

.vk-bilgi { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--yuzey); font-size: 15.5px; }
.vk-soru { font-weight: 700; margin: 10px 0 10px; }
.vk-secenekler { display: grid; gap: 8px; }
.vk-sec { appearance: none; display: flex; align-items: flex-start; gap: 10px; width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--metin); text-align: left; font-size: 16px; line-height: 1.4; }
.vk-sec .kutu { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--soluk); }
.vk-sec[aria-pressed="true"] { border-color: var(--bilgi); background: var(--bilgi-yuzey); }

.vk-kontrol { margin-top: 10px; }
.vk-sonuc { border: 1px solid var(--cizgi); border-left: 4px solid var(--cizgi); border-radius: 12px; padding: 10px 12px; background: var(--yuzey); font-size: 15.5px; }

.vk-sonuc.kacti .vk-etiket { color: var(--uyari); }
.vk-m { font-weight: 700; }
.vk-ek { margin-top: 4px; color: var(--bilgi); }
.vk-neden { margin-top: 4px; }
.vk-hesap { margin-top: 4px; font-size: 14px; color: var(--soluk); }
.vk-git { appearance: none; border: 0; background: none; color: var(--bilgi); font-weight: 700; font-size: 14.5px; padding: 8px 0 0; min-height: 40px; text-decoration: underline; text-underline-offset: 3px; }
.vk-puan { margin-top: 10px; font-weight: 700; color: var(--soluk); font-size: 14.5px; }
.vk-ozet { margin-top: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ekg-cizgi); background: var(--ekg-yuzey); font-size: 15.5px; }
.vk-yaz { min-height: 180px; margin-bottom: 10px; background: var(--yuzey); }
.vk-model { margin-top: 12px; }
.vk-model h3 { font-size: 15px; color: var(--bilgi); margin: 6px 0 8px; }
.vk-model h3.uyari-bas { color: var(--alarm); margin-top: 16px; }
.vk-model dl { margin: 0; font-size: 15.5px; }

.vk-son { border-top: 1px solid var(--cizgi); padding-top: 16px; }
.vk-skor { font-size: 18px; }
.vk-skor b { font-size: 34px; color: var(--ekg); font-variant-numeric: tabular-nums; }
.vk-son h3 { font-size: 15px; color: var(--alarm); margin: 14px 0 6px; }
.vk-hatalar { margin: 0; padding-left: 20px; font-size: 15px; }

.vk-son-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
